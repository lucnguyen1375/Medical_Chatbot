services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-chatbot-hapi-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hapi"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medical-chatbot-hapi-fhir
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_CONFIG_LOCATION: file:///data/hapi/application.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./config/application.yaml:/data/hapi/application.yaml:ro
    restart: unless-stopped

volumes:
  hapi-postgres-data:
